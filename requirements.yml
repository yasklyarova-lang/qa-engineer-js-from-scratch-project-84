functional:
  - Пользователь должен иметь возможность искать товары по ключевому слову
  - Пользователь должен иметь возможность искать товары по категории
  - Пользователь должен иметь возможность фильтровать товары
  - Пользователь должен иметь возможность просматривать список товаров
  - Пользователь должен иметь возможность просматривать подробную информацию о товаре
  - Пользователь должен иметь возможность добавлять товары в корзину
  - Пользователь должен иметь возможность просматривать содержимое корзины
  - Пользователь должен иметь возможность оформлять заказ
  - Пользователь должен иметь возможность переключать язык интерфейса

non-functional:
  - Основные страницы сайта должны загружаться не более чем за 3 секунды
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен иметь мобильную версию
  - Сайт должен корректно работать в последних стабильных версиях Google Chrome, Mozilla Firefox и Safari
  - Сайт должен выдерживать одновременную работу 100 пользователей без ошибок
  - Интерфейс сайта должен быть локализован на русский язык
  - Интерфейс сайта должен быть локализован на английский язык

implicit:
  - Система должна использовать кэширование для ускорения повторной загрузки ресурсов
  - Сайт должен использовать HTTPS для обеспечения безопасного соединения
  - Итоговая стоимость товаров в корзине должна рассчитываться с учётом количества каждого товара
  - На основных страницах сайта не должно быть JavaScript-ошибок в Console
