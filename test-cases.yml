---
- summary: |
    Успешный поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
    Автоматический перевод страницы в браузере отключён
    Доступна строка поиска
  test-data: |
    Ключевое слово = Essence Mascara Lash Princess
  steps:
    - Ввести «Essence Mascara Lash Princess» в строку поиска
    - Выполнить поиск
  expected-result: |
    В результатах поиска отображается товар «Essence Mascara Lash Princess»

