---
- summary: |
    Проверка сообщения о плохом соединении при медленной загрузке страницы
  requirement: |
    Сайт должен учитывать удобство использования и быть оптимизирован для скорости работы
  prerequisites: |
    URL главной = https://products-store.hexlet.app
    Открыт браузер с DevTools
    Открыта вкладка Network
    Кэш сброшен
  test-data: |
    Slow 3G
  steps:
    - Открыть DevTools → Network
    - Включить Slow 3G
    - Перезагрузить страницу
    - Дождаться загрузки более 4 секунд
    - Проверить сообщение
  expected-result: |
    Появляется сообщение о плохом соединении

- summary: |
    Проверка защиты поиска от XSS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Сайт открыт, доступна строка поиска
  test-data: |
    XSS = <script>alert("test")</script>
  steps:
    - Ввести в строку поиска XSS-payload
    - Нажать Enter
  expected-result: |
    XSS-скрипт не выполняется, введённый текст отображается как обычный текст

- summary: |
    Проверка поиска товаров по ключевому слову
  requirement: |
    Товар находится по ключевому слову в поиске
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
    Доступна строка поиска
  test-data: |
    Ключевое слово = название существующего товара
  steps:
    - Ввести в поиск ключевое слово товара
    - Нажать Enter
  expected-result: |
    В результатах поиска отображается товар, соответствующий ключевому слову

