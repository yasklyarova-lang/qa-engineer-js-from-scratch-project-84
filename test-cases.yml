- summary: |
 Проверка сообщения о плохом соединении при медленной загрузке страницы.
requirement: |
  Сайт должен учитывать удобство использования и быть оптимизирован для скорости работы.
prerequisites: |
  URL главной = https://products-store.hexlet.app;
  открыт браузер с DevTools;
  открыта вкладка Network;
  кэш сброшен.
test-data: |
  Slow 3G
steps:
  Открыть DevTools → Network
  Включить Slow 3G
  Перезагрузить страницу
  Дождаться загрузки более 4 секунд
  Проверить сообщение
expected-result: |
  Появляется сообщение о плохом соединении.

- summary: |
  Проверка безопасности сайта и защиты данных пользователя
requirement: |
  Сайт безопасный и защищает данные пользователя
prerequisites: |
  Chrome, DevTools открыт.
  Доступна только строка поиска.
test-data: |
  SQL-инъекция = ' OR 1=1 --
  XSS = <script> alert("Я отправил вам скрипт! Пришлите денег, пожалуйста :(");
</script>
steps:
  - Открыть https://products-store.hexlet.app/cart, проверить редирект на HTTPS
  - Ввести ' OR 1=1 -- в поиск, нажать Enter
  - Ввести <script>
  alert("Я отправил вам скрипт! Пришлите денег, пожалуйста :(");
</script> в поиск, нажать Enter
expected-result: |
  1. HTTP редиректит на HTTPS.
  2. SQL-инъекция не проходит: «Ничего не найдено», ошибок SQL нет.
  3. XSS не срабатывает: скрипт не выполняется, ввод экранирован.

- summary: |
  Проверка поиска товаров по ключевому слову
requirement: |
  Товар находится по ключевому слову в поиске
prerequisites: |
  Chrome.
  Открыт сайт https://products-store.hexlet.app
  Найти окно поиска
test-data: |
  Ключевое слово = Красная помада
steps:
  - Открыть главную
  - Ввести в поиск «Красная помада», нажать Enter
expected-result: |
  1. Поиск по «Красная помада» находит товар «Красная помада».
  2. В результатах нет товаров из других категорий.

- summary: |
  Проверка фильтрации товаров по параметрам
requirement: |
  Товар находится по категории, цене и бренду
prerequisites: |
  Chrome.
  Открыт сайт https://products-store.hexlet.app
  В каталоге есть товар «Красная помада» (цена 11,41 $) и «Красный лак для ногтей» (цена 7,96 $).
test-data: |
  Фильтр цены = от 7 до 15 $
  Фильтр категории = Красота
  Фильтр бренда = Chic Cosmetics
steps:
  - Открыть главную
  - Применить фильтр «Цена: от 7 до 15 $»
  - Проверить список товаров
  - Добавить фильтр «Категория: Красота»
  - Проверить список товаров
  - Добавить фильтр «Бренд: Chic Cosmetics»
  - Сбросить все фильтры
expected-result: |
  1. При фильтре «Цена: 7 до 15 $» в списке только товары в этом диапазоне.
  2. Товар «Красная помада» (11,41 $) присутствует, «Красный лак для ногтей» (7,96 $) присутствует.
  3. При добавлении «Категории: Красота» список сужается: только косметика в диапазоне 7 до 15 $.
  4. При добавлении «Фильтра: Бренд» список сужается: только косметика бренда Chic Cosmetics.
  При сбросе фильтров возвращается полный список товаров.

 - summary: |
  Сайт корректно отображается и работает на мобильном устройстве
requirement: |
  Сайт должен иметь мобильную версию
prerequisites: |
  Chrome, DevTools открыт.
  Открыт сайт https://products-store.hexlet.app
  DevTools → Toggle device toolbar включён
  Выбрано устройство iPhone SE (375×667)
test-data: |
  URL главной = https://products-store.hexlet.app
  Устройство = iPhone SE (375×667)
steps:
  - Открыть главную, проверить вёрстку и отсутствие горизонтальной прокрутки
  - Проверить наличие гамбургера, кликнуть — меню раскрывается
  - Пролистать страницу вниз
  - Открыть каталог, проверить карточки товаров
  - Открыть фильтры, применить фильтр
  - Открыть карточку товара
  - Нажать «В корзину», открыть корзину
  - Повернуть экран в ландшафт (667×375)
expected-result: |
  1. Вёрстка под 375 px, горизонтальной прокрутки нет.
  2. Гамбургер раскрывает и сворачивает меню.
  3. Карточки товаров отображаются корректно.
  4. Фильтр применяется, вёрстка не ломается.
  5. Кнопки ≥ 44 px, текст ≥ 16 px.
  6. Товар в корзине, счётчик = 1.
  7. В ландшафте вёрстка не ломается.

 - summary: |
  Сайт корректно работает последних версиях Chrome, Firefox, Safari, Edge
requirement: |
  Сайт совместим с последними версиями браузеров:
  Chrome, Firefox, Safari, Edge
prerequisites: |
  Установлены последние версии браузеров:
  Chrome, Firefox, Safari, Edge.
  Открыт сайт https://products-store.hexlet.app
test-data: |
  URL главной = https://products-store.hexlet.app
  Товар для проверки = Красная помада
steps:
  - Открыть главную в Chrome, проверить отображение и работу поиска
  - Открыть каталог в Chrome, проверить отображение и работу фильтров
  - Открыть карточку товара в Chrome, проверить отображение
  - Повторить шаги 1–3 в Firefox
  - Повторить шаги 1–3 в Safari
  - Повторить шаги 1–3 в Edge
expected-result: |
  1. Во всех четырёх браузерах сайт открывается без ошибок.
  2. Вёрстка не ломается: меню, карточки, кнопки на своих местах.
  3. Поиск работает одинаково во всех браузерах.
  4. Фильтры работают одинаково во всех браузерах.
  5. Карточка товара отображается корректно.
  6. Нет ошибок в консоли браузера (F12 → Console).
  7. Нет различий в поведении между Chrome, Firefox, Safari, Edge.

