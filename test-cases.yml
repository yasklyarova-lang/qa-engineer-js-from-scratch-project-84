---
- summary: |
    Отображение сообщения о плохом соединении при медленной загрузке страницы
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
    Открыты DevTools → Network
    Кэш браузера сброшен
  test-data: |
    Тип соединения = Slow 3G
  steps:
    - Открыть DevTools → Network
    - Включить Slow 3G
    - Перезагрузить страницу
    - Дождаться загрузки страницы
  expected-result: |
    Отображается сообщение о плохом соединении при длительной загрузке страницы

- summary: |
    Кэширование статических ресурсов при повторной загрузке страницы
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
    Открыты DevTools → Network
  test-data: |
    Ресурс = CSS, JavaScript или изображение
  steps:
    - Открыть главную страницу
    - Перезагрузить страницу
    - Проверить загрузку статических ресурсов в DevTools → Network
  expected-result: |
    При повторной загрузке статические ресурсы загружаются из кэша браузера или не загружаются повторно, если они не изменились

- summary: |
    Защита поиска от XSS-атаки
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
    Доступна строка поиска
  test-data: |
    XSS-payload = <script>alert("test")</script>
  steps:
    - Ввести XSS-payload в строку поиска
    - Выполнить поиск
  expected-result: |
    JavaScript-код не выполняется, введённое значение отображается как обычный текст

- summary: |
    Успешное открытие сайта по защищённому HTTPS-соединению
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Есть интернет-соединение
  test-data: |
    URL = https://products-store.hexlet.app
  steps:
    - Открыть сайт по HTTPS
    - Проверить адресную строку браузера
  expected-result: |
    Сайт открывается по HTTPS, соединение защищено, предупреждение о небезопасном соединении отсутствует

