- summary: |
    Проверка работы сайта при одновременной нагрузке 100 пользователей
  requirement: |
    Сайт должен выдерживать одновременную работу 100 пользователей без ошибок
  prerequisites: |
    Сайт https://products-store.hexlet.app доступен
    Установлен инструмент k6
  test-data: |
    Количество виртуальных пользователей = 100
    Продолжительность теста = 1 минута
  steps:
    - Запустить нагрузочный тест в k6
    - Создать нагрузку в 100 одновременных виртуальных пользователей
    - Поддерживать нагрузку в течение 1 минуты
    - Проверить результаты выполнения запросов
  expected-result: |
    Сайт остается доступным в течение всего теста
    Запросы выполняются без ошибок

