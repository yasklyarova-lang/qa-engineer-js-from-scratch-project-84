- summary: |
    Сохранение доступности сайта при высокой нагрузке
  requirement: |
    Важно, чтобы сайт мог обрабатывать большое количество трафика
  prerequisites: |
    Доступен инструмент нагрузочного тестирования
  test-data: |
    URL = https://products-store.hexlet.app
    Количество пользователей = 100
    Длительность нагрузки = 5 минут
  steps:
    - Запустить нагрузочный тест со 100 одновременными пользователями
    - Открыть главную страницу во время выполнения теста
  expected-result: |
    Главная страница загружается, сайт остаётся доступным, HTTP-ответы не содержат ошибок 5xx

