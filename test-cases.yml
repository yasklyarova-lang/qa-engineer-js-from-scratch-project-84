- summary: |
  Проверка удобства использования сайта магазина Hexlet
requirement: |
  Покупатель быстро находит товар,
  не теряет данные, получает понятную обратную связь
prerequisites: |
  Открыта главная страница сайта. Chrome.
  В каталоге есть красная помада, 11,41$, в наличии.
test-data: |
  Поиск = Красная помада
  Фильтр = красота, бренд = Chic Cosmetics
steps:
  - Открыть каталог с главной (≤ 2 клика)
  - Найти поиск и тележку на главной
  - Ввести в поиск название товара "Красная помада"  
  - С карточки товара кликнуть по логотипу
  - Из карточки нажать «магазин»
  - Применить фильтр = красота, бренд = Chic Cosmetics
  - Нажать на карточку товара
  - Нажать на кнопку добавить в корзину
  - Открыть тележку
expected-result: |
  1. Каталог открылся ≤ 2 клика.
  2. Поиск и тележка есть на главной.
  3. Товар в поиске отобразился
  4. При нажатии на «магазин» открывается главная страница магазина
  5. Фильтр применился
  6. При нажатии на карточку товара, открывается карточка
  7. Нажимаем добавить в корзину
  8. При нажатии на тележку переходим в корзину
  9. Товар в корзине, счетчик = 1.


- summary: |
  Проверка скорости загрузки страниц магазина
requirement: |
  Сайт должен быть оптимизирован: страницы и изображения грузятся быстро,
  работает на медленном интернете
prerequisites: |
  Chrome, DevTools → Network, кэш очищен, интернет ≥ 10 Мбит/с.
  В каталоге ≥ 30 товаров.
test-data: |
  URL = https://products-store.hexlet.app/
  Поиск = Красная помада
  Фильтр = красота, бренд = Chic Cosmetics
steps:
  - Открыть главную, замерить Load и LCP
  - Открыть каталог, замерить время до первого товара
  - Проверить, какие изображения загружены без скролла
  - Пролистать до 15-го товара, проверить загрузку изображений
  - Применить фильтр, замерить отклик
  - Открыть карточку красная помада, замерить загрузку
  - Запустить Lighthouse (Mobile) для главной
  - Включить Slow 3G, открыть главную, каталог, товар
  - Обновить главную, проверить кэш статики
  - Ввести красная помада в поиск, замерить результат
  - Проверить формат изображений
expected-result: |
  1. Load ≥ 3 сек, LCP ≤ 2.5 сек.
  2. Первый товар ≤ 3 сек.
  3. Изображения ниже экрана загружены.
  4. Изображения 10–15 загрузились при прокрутке.
  5. Отклик на фильтр ≤ 1 сек или лоадер.
  6. Карточка загрузилась ≤ 3 сек.
  7. Lighthouse: Performance ≥ 80, LCP ≤ 2.5, CLS ≤ 0.1.
  8. На 3G всё открылось, сайт не упал.
  9. Статика из кэша (304 / disk cache).
  10. Поиск ≤ 2 сек.
  11. Формат WebP/AVIF.

- summary: |
  Проверка безопасности через строку поиска: HTTPS, SQL-инъекция, XSS, утечка в ошибках
requirement: |
  Сайт должен быть безопасным и защищать данные пользователя
prerequisites: |
  Chrome на Mac, DevTools открыт.
  Доступна только строка поиска.
test-data: |
  SQL-инъекция = ' OR 1=1 --
  XSS = <script> alert("Я отправил вам скрипт! Пришлите денег, пожалуйста :(");
</script>
  URL главной = https://products-store.hexlet.app/cart
steps:
  - Открыть https://products-store.hexlet.app/cart, проверить редирект на HTTPS
  - Ввести ' OR 1=1 -- в поиск, нажать Enter
  - Ввести <script>
  alert("Я отправил вам скрипт! Пришлите денег, пожалуйста :(");
</script> в поиск, нажать Enter
  - Открыть /api/xxx, вызвать ошибку 500
expected-result: |
  1. HTTP редиректит на HTTPS.
  2. SQL-инъекция не проходит: «Ничего не найдено», ошибок SQL нет.
  3. XSS не срабатывает: скрипт не выполняется, ввод экранирован.
  4. В ошибке 500 нет стека, путей, SQL-запросов.

  - summary: |
  Проверка поиска товаров по ключевому слову и по категории
requirement: |
  Пользователь должен иметь возможность искать товары по ключевому слову или категории
prerequisites: |
  Chrome на Mac.
  Открыт сайт https://products-store.hexlet.app
  В каталоге есть товар «Красная помада».
  Есть категория «Красота» с товарами.
test-data: |
  Ключевое слово = Красная помада
  Категория = Красота
  URL главной = https://products-store.hexlet.app
steps:
  - Открыть главную
  - Ввести в поиск «Красная помада», нажать Enter
  - Открыть каталог
  - Выбрать категорию «Красота»
expected-result: |
  1. Поиск по «Красная помада» находит товар «Красная помада».
  2. При выборе категории «Красота» показываются только товары этой категории.
  3. В результатах нет товаров из других категорий.

 - summary: |
  Проверка фильтрации товаров по параметрам (цена, бренд, категория)
requirement: |
  Пользователь должен иметь возможность фильтровать товары
prerequisites: |
  Chrome на Mac.
  Открыт сайт https://products-store.hexlet.app
  Открыт каталог товаров.
  В каталоге > 30 товаров, среди них «Красная помада» ( цена 11,41 $) и «Красный лак для ногтей» (цена 7,96 $).
test-data: |
  Фильтр цены = от 7 до 15 $
  Фильтр категории = Красота
  URL каталога = https://products-store.hexlet.app/catalog
steps:
  - Открыть каталог
  - Применить фильтр «Цена: от 7 до 15 $»
  - Проверить список товаров
  - Добавить фильтр «Категория: Красота»
  - Проверить список товаров
  - Сбросить все фильтры
expected-result: |
  1. При фильтре «Цена: 17 до 15 $» в списке только товары в этом диапазоне.
  2. Товар «Красная помада» (11,41 $) присутствует, «Красный лак для ногтей» (7,96 $) присутствует.
  3. При добавлении «Категория: Красота» список сужается: только косметика в диапазоне 17 до 15 $.
  4. При сбросе фильтров возвращается полный список товаров.

 - summary: |
  Проверка отображения и работы сайта на мобильном устройстве
requirement: |
  Сайт должен иметь мобильную версию: интерфейс адаптирован под экран телефона,
  нет горизонтальной прокрутки, элементы доступны для нажатия пальцем
prerequisites: |
  Chrome на Mac, DevTools открыт.
  Открыт сайт https://products-store.hexlet.app
  DevTools → Toggle device toolbar включён
  Выбрано устройство iPhone SE (375×667)
test-data: |
  URL главной = https://products-store.hexlet.app
  Устройство = iPhone SE (375×667)
steps:
  - Включить режим устройства iPhone SE в DevTools
  - Открыть главную
  - Пролистать страницу вниз
  - Открыть карточку товара «Красная помада»
  - Открыть магазин
  - Проверить размер кнопок и ссылок
expected-result: |
  1. Вёрстка адаптирована под ширину 375 px.
  2. Нет горизонтальной прокрутки.
  3. Меню сворачивается в «гамбургер».
  4. Кнопки и ссылки ≥ 44 px — удобны для нажатия пальцем.
  5. Текст читаем без зума.
  6. Карточка товара отображается корректно: фото, название, цена видны.
  7. Ничего не выходит за пределы экрана.
