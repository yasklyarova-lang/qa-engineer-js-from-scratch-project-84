 - summary: |
    Проверка просмотра товаров и подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать товары и подробную информацию о товаре.
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
  test-data: |
    Любой товар из каталога
  steps:
    - Открыть каталог
    - Проверить, что в каталоге отображаются карточки товаров
    - Открыть любой товар
    - Проверить, что открылась страница товара
  expected-result: |
    1. В каталоге отображаются карточки товаров.
    2. У товаров есть фото, название и цена.
    3. При открытии товара отображается страница с подробной информацией.
    4. На странице товара есть фото, название, цена, описание и характеристики.

- summary: |
    Проверка добавления товара в корзину и просмотра её содержимого
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины.
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app
    Корзина пуста
  test-data: |
    Любой товар из каталога
  steps:
    - Открыть каталог
    - Открыть карточку товара
    - Нажать «В корзину»
    - Открыть корзину
  expected-result: |
    1. Товар добавляется в корзину.
    2. В корзине отображается название товара.
    3. У товара отображаются количество и цена.
    4. Отображается итоговая сумма.
    5. Корзина не пустая после добавления товара.

