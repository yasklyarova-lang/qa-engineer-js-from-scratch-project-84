- summary: |
  Проверка удобства использования сайта магазина Hexlet
requirement: |
  Покупатель быстро находит товар,
  не теряет данные, получает понятную обратную связь
prerequisites: |
  Открыта главная страница сайта. Chrome.
  В каталоге есть красная помада, 11,41$, в наличии.
test-data: |
  Поиск = Красная помада
  Фильтр = красота, бренд = Chic Cosmetics
steps:
  - Открыть каталог с главной (≤ 2 клика)
  - Найти поиск и тележку на главной
  - Ввести в поиск название товара "Красная помада"  
  - С карточки товара кликнуть по логотипу
  - Из карточки нажать «магазин»
  - Применить фильтр = красота, бренд = Chic Cosmetics
  - Нажать на карточку товара
  - Нажать на кнопку добавить в корзину
  - Открыть тележку
expected-result: |
  1. Каталог открылся ≤ 2 клика.
  2. Поиск и тележка есть на главной.
  3. Товар в поиске отобразился
  4. При нажатии на «магазин» открывается главная страница магазина
  5. Фильтр применился
  6. При нажатии на карточку товара, открывается карточка
  7. Нажимаем добавить в корзину
  8. При нажатии на тележку переходим в корзину
  9. Товар в корзине, счетчик = 1.


- summary: |
  Проверка скорости загрузки страниц магазина
requirement: |
  Сайт должен быть оптимизирован: страницы и изображения грузятся быстро,
  работает на медленном интернете
prerequisites: |
  Chrome, DevTools → Network, кэш очищен, интернет ≥ 10 Мбит/с.
  В каталоге ≥ 30 товаров.
test-data: |
  URL = https://products-store.hexlet.app/
  Поиск = Красная помада
  Фильтр = красота, бренд = Chic Cosmetics
steps:
  - Открыть главную, замерить Load и LCP
  - Открыть каталог, замерить время до первого товара
  - Проверить, какие изображения загружены без скролла
  - Пролистать до 15-го товара, проверить загрузку изображений
  - Применить фильтр, замерить отклик
  - Открыть карточку красная помада, замерить загрузку
  - Запустить Lighthouse (Mobile) для главной
  - Включить Slow 3G, открыть главную, каталог, товар
  - Обновить главную, проверить кэш статики
  - Ввести красная помада в поиск, замерить результат
  - Проверить формат изображений
expected-result: |
  1. 1. Load ≥ 3 сек, LCP ≤ 2.5 сек.
  2. Первый товар ≤ 3 сек.
  3. Изображения ниже экрана загружены.
  4. Изображения 10–15 загрузились при прокрутке.
  5. Отклик на фильтр ≤ 1 сек или лоадер.
  6. Карточка загрузилась ≤ 3 сек.
  7. Lighthouse: Performance ≥ 80, LCP ≤ 2.5, CLS ≤ 0.1.
  8. На 3G всё открылось, сайт не упал.
  9. Статика из кэша (304 / disk cache).
  10. Поиск ≤ 2 сек.
  11. Формат WebP/AVIF.

- summary: |
  Проверка безопасности сайта и защиты данных пользователя
requirement: |
  Сайт безопасный и защищает данные пользователя
prerequisites: |
  Chrome, DevTools открыт.
  Доступна только строка поиска.
test-data: |
  SQL-инъекция = ' OR 1=1 --
  XSS = <script> alert("Я отправил вам скрипт! Пришлите денег, пожалуйста :(");
</script>
  URL главной = https://products-store.hexlet.app/cart
steps:
  - Открыть https://products-store.hexlet.app/cart, проверить редирект на HTTPS
  - Ввести ' OR 1=1 -- в поиск, нажать Enter
  - Ввести <script>
  alert("Я отправил вам скрипт! Пришлите денег, пожалуйста :(");
</script> в поиск, нажать Enter
expected-result: |
  1. HTTP редиректит на HTTPS.
  2. SQL-инъекция не проходит: «Ничего не найдено», ошибок SQL нет.
  3. XSS не срабатывает: скрипт не выполняется, ввод экранирован.

