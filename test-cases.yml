summary: |
  Проверка переключения языка интерфейса
requirement: |
  Пользователь должен иметь возможность переключить язык интерфейса
prerequisites: |
  Открыт сайт https://products-store.hexlet.app
  Доступен переключатель языка
test-data: |
  Текущий язык = RU
  Новый язык = EN
steps:
  - Открыть главную, проверить язык RU
  - Найти переключатель языка, выбрать EN
  - Проверить интерфейс на английском
  - Переключить обратно на RU
expected-result: |
  1. Интерфейс переключается с RU на EN.
  2. После переключения — надписи на английском.
  3. Пользователь остаётся на той же странице.
  4. Выбор языка сохраняется.
  5. Обратное переключение на RU работает.

 - summary: |
  Проверка перевода интерфейса на русский и английский языки
requirement: |
  Сайт должен иметь локализацию (перевод) на русский и английский языки
prerequisites: |
  Chrome на Mac.
  Открыт сайт https://products-store.hexlet.app
  Доступен переключатель языка RU / EN.
test-data: |
  URL главной = https://products-store.hexlet.app
  Ожидаемые надписи RU = Корзина, Каталог, Цена
  Ожидаемые надписи EN = Cart, Catalog, Price
  Поисковый запрос = Red Lipstick
steps:
  - Открыть главную на RU, проверить перевод интерфейса
  - Переключить на EN, проверить перевод интерфейса
  - Открыть каталог на EN, проверить перевод фильтров и категорий
  - Открыть карточку товара на EN, проверить перевод описания
  - Ввести в поиск «Red Lipstick» на EN, проверить результаты
  - Переключить обратно на RU, проверить перевод
expected-result: |
  1. На RU интерфейс полностью на русском: «Корзина», «Каталог», «Цена».
  2. На EN интерфейс полностью на английском: «Cart», «Catalog», «Price».
  3. На EN переведены фильтры, категории, ошибки.
  4. Карточка товара на EN: описание, характеристики переведены.
  5. Поиск работает на обоих языках.
  6. Нет «зашитых» строк на другом языке.
  7. Формат цены и даты соответствует языку.
  8. Переключение обратно на RU работает корректно.

 - summary: |
  Проверка доступности сайта из сети Интернет без использования VPN
requirement: |
  Сайт должен быть доступен для пользователей без использования VPN
  (прямой доступ из сети Интернет)
prerequisites: |
  Mac без активного VPN.
  Отключены все прокси и расширения, меняющие IP.
  Разные интернет-провайдеры (например, домашний Wi-Fi и мобильный интернет).
  Браузер Chrome последней версии.
test-data: |
  URL сайта = https://products-store.hexlet.app
  Провайдер 1 = домашний Wi-Fi
  Провайдер 2 = мобильный интернет (4G)
  Инструмент проверки = ping / nslookup / браузер
steps:
  - Отключить VPN и прокси на Mac
  - Открыть сайт через домашний Wi-Fi
  - Проверить, что сайт открывается без ошибок
  - Проверить SSL-сертификат (замок в адресной строке)
  - Проверить доступность через мобильный интернет (4G)
  - Проверить DNS: nslookup products-store.hexlet.app
  - Проверить, что сайт не в реестре запрещённых
expected-result: |
  1. VPN отключён — сайт открывается напрямую.
  2. Через домашний Wi-Fi сайт загружается без ошибок.
  3. SSL-сертификат валиден (замок в адресной строке).
  4. Через мобильный интернет сайт тоже открывается.
  5. DNS резолвится корректно (nslookup возвращает IP).
  6. Сайт не в реестре запрещённых сайтов.
  7. Нет редиректов на заглушки или блокировки провайдером.
