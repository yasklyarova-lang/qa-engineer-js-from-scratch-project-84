---
- summary: |
    Поиск товаров не работает по названиям на русском языке
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Ввести в строку поиска название товара на русском 
    3. Нажать Enter
  expected-result: |
    Товар находится по введенному названию
  actual-result: |
    Товар не находится, поиск работает только при вводе названия товара на английском языке
    
- summary: |
    Фильтрация товаров зависит от чекбокса «В наличии»
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
  macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров
    2. Выбрать категорию, производителя или диапазон цены
    3. Не включать фильтр «В наличии»
  expected-result: |
    Выбранный фильтр работает независимо от чекбокса «В наличии»
  actual-result: |
    Фильтрация не работает, пока не включен чекбокс «В наличии»

- summary: |
    Фильтр товаров по производителю не работает без включенного фильтра «В наличии»
  environment: |
   Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
  macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров
    2. Выбрать производителя
    3. Не включать фильтр «В наличии»
  expected-result: |
    Отображаются только товары выбранного производителя
  actual-result: |
    Фильтрация по производителю не работает
    Фильтр начинает работать только после включения чекбокса «В наличии»

- summary: |
    Фильтр товаров по цене не работает без включенного фильтра «В наличии»
  environment: |
   Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
  macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров
    2. Указать минимальную и максимальную цену
    3. Не включать фильтр «В наличии»
  expected-result: |
    Отображаются только товары, соответствующие указанному диапазону цены
  actual-result: |
    Фильтрация по цене не работает
    Фильтр начинает работать только после включения чекбокса «В наличии»

- summary: |
    Основной контент страницы не отображается на мобильном устройстве
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
  macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Открыть Chrome DevTools
    3. Включить Toggle device toolbar
    4. Выбрать устройство iPhone SE с разрешением 375×667
    5. Открыть главную страницу сайта
  expected-result: |
    Основной контент страницы корректно отображается и адаптируется под разрешение 375×667
 actual-result: |
    На мобильном разрешении 375×667 основной контент страницы не отображается
    Товары и элементы каталога отсутствуют

- summary: |
    Некорректное отображение фильтров на планшетном разрешении
  environment: |
   Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
  macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Открыть Chrome DevTools
    3. Включить Toggle device toolbar
    4. Установить разрешение 768×1024
    5. Открыть главную страницу
  expected-result: |
    Страница корректно адаптируется под разрешение 768×1024
    Элементы фильтра полностью отображаются и не обрезаются
  actual-result: |
    Блок фильтров отображается некорректно
    Названия брендов переносятся на несколько строк из-за недостаточной ширины блока
    Поля фильтра по цене отображаются не полностью
