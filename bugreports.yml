- summary: |
    При нагрузке 100 виртуальных пользователей часть запросов завершается ошибкой
  environment: |
    macOS 26.5.2 (25F84)
    k6 v2.3.0
  steps-to-reproduce: |
    1. Запустить нагрузочный тест сайта https://products-store.hexlet.app с помощью k6
    2. Установить количество виртуальных пользователей 100
    3. Установить продолжительность теста 1 минута
    4. Дождаться завершения теста
    5. Проверить результаты тестирования
  expected-result: |
    Сайт остается доступным при одновременной работе 100 виртуальных пользователей
    Все запросы выполняются без ошибок
  actual-result: |
    32 из 2775 запросов завершаются ошибкой request timeout
    Доля неуспешных запросов составляет 1.15%
    Ошибка изображена на скриншотах "нагрузочный тест 1.png" и "нагрузочный тест 2.png" в папке Screenshots
