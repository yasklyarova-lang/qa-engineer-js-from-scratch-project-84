---
- summary: |
    Поиск товара зависит от фильтра «В наличии»
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Убедиться, что фильтр «В наличии» выключен
    3. Ввести в строку поиска «Essence Mascara Lash Princess»
    4. Нажать Enter
    5. Включить фильтр «В наличии»
  expected-result: |
    Товар «Essence Mascara Lash Princess» находится независимо от состояния фильтра «В наличии»
  actual-result:
  При выключенном фильтре «В наличии» товар не находится
  После включения фильтра «В наличии» товар отображается
  Ошибка изображена на скриншотах "поиск товара по ключ слову.png" и "поиск товара по ключ слову с фильтром в наличии.png" в папке Screenshots   

- summary: |
    Пустой поиск зависит от фильтра «В наличии»
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Оставить строку поиска пустой
    3. Убедиться, что фильтр «В наличии» выключен
    4. Включить фильтр «В наличии»
  expected-result: |
    Пустой поиск отображает каталог товаров независимо от состояния фильтра «В наличии»
  actual-result: |
    При выключенном фильтре «В наличии» отображается сообщение «Nothing found!»
    После включения фильтра «В наличии» отображается каталог товаров
    Ошибка изображена на скриншотах "пустой поиск.png" и "пустой поиск с фильтром.png" в папке Screenshots

