- summary: |
  Поиск не находит товар по локализованным названиям «Красная помада» (RU) и «Rouge à lèvres» (FR)

environment: |
  Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
  macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664

steps-to-reproduce: |
  1. Открыть https://products-store.hexlet.app
  2. Убедиться, что язык интерфейса — RU
  3. Ввести в строку поиска «Красная помада»
  4. Нажать Enter
     → ошибка на шаге 4: «Ничего не найдено»
  5. Переключить язык интерфейса на FR
  6. Ввести в строку поиска «Rouge à lèvres»
  7. Нажать Enter
     → ошибка на шаге 7: «Ничего не найдено»
  8. Переключить язык интерфейса на EN
  9. Ввести в строку поиска «Red Lipstick»
  10. Нажать Enter
      → товар найден
  11. Открыть каталог и убедиться, что товар «Red Lipstick» (ID=4) есть в наличии

expected-result: |
  Поиск находит товар по локализованному названию на любом языке интерфейса:
  - «Красная помада» (RU) → товар «Red Lipstick» (ID=4)
  - «Rouge à lèvres» (FR) → товар «Red Lipstick» (ID=4)
  - «Red Lipstick» (EN) → товар «Red Lipstick» (ID=4)
  В результатах есть карточка с фото, названием на текущем языке и ценой 11,41 $.

actual-result: |
  Поиск работает только по английскому названию:
  - «Красная помада» (RU) → «Ничего не найдено»
  - «Rouge à lèvres» (FR) → «Ничего не найдено»
  - «Red Lipstick» (EN) → товар найден
  При этом товар «Red Lipstick» (ID=4) присутствует в каталоге,
  локализация интерфейса работает.


  
