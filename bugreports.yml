---
- summary: |
    Поиск товаров не работает по названиям на русском языке
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Ввести в строку поиска название товара на русском 
    3. Нажать Enter
  expected-result: |
    Товар находится по введенному названию
  actual-result: |
    Товар не находится, поиск работает только при вводе названия товара на английском языке
    
- summary: |
    Фильтрация товаров зависит от чекбокса «В наличии»
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров
    2. Выбрать категорию, производителя или диапазон цены
    3. Не включать фильтр «В наличии»
  expected-result: |
    Выбранный фильтр работает независимо от чекбокса «В наличии»
  actual-result: |
    Фильтрация не работает, пока не включен чекбокс «В наличии»

- summary: |
    Панель фильтров некорректно отображается на мобильном разрешении
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть Chrome DevTools
    2. Включить Toggle device toolbar
    3. Выбрать устройство iPhone SE с разрешением 375×667
    4. Открыть или обновить страницу https://products-store.hexlet.app
    5. Просмотреть панель фильтров
  expected-result: |
    Панель фильтров корректно отображается на экране 375×667, элементы полностью видны и не обрезаются
  actual-result: |
    Панель фильтров отображается некорректно: названия производителей переносятся на несколько строк, поля цены обрезаются

- summary: |
      Некорректное отображение элементов карточки товара на мобильном устройстве
environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84)
      Chrome DevTools, мобильное разрешение
steps-to-reproduce: |
      1. Открыть сайт https://products-store.hexlet.app
      2. Включить мобильное разрешение экрана
      3. Открыть каталог товаров
      4. Прокрутить страницу до карточек товаров
      5. Обратить внимание на цену, количество товара и кнопку «Добавить в корзину»
expected-result: |
      Все элементы карточки товара корректно отображаются и не перекрывают друг друга
actual-result: |
      Элементы карточки товара отображаются некорректно: цена, количество товара и кнопка «Добавить в корзину» расположены слишком тесно и нарушают вёрстку карточки

- summary: |
    Элементы корзины некорректно отображаются на мобильном разрешении
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть Chrome DevTools
    2. Включить Toggle device toolbar
    3. Выбрать устройство iPhone SE с разрешением 375×667
    4. Открыть или обновить страницу https://products-store.hexlet.app
    5. Добавить товары в корзину
    6. Открыть корзину
  expected-result: |
    Элементы корзины корректно отображаются на экране 375×667 и не перекрывают друг друга
  actual-result: |
    Элементы товаров в корзине перекрываются и переносятся, цена и количество отображаются некорректно, элементы управления отображаются не полностью

- summary: |
    Не отображается флаг английского языка в списке выбора языка
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. Открыть меню выбора языка
  expected-result: |
    Отображается флаг английского языка
  actual-result: |
    Вместо флага английского языка отображается значок незагруженного изображения

- summary: |
    Элементы каталога некорректно отображаются на планшетном разрешении
  environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
  steps-to-reproduce: |
    1. Открыть Chrome DevTools
    2. Включить Toggle device toolbar
    3. Установить разрешение 768×1024
    4. Открыть или обновить страницу https://products-store.hexlet.app
    5. Просмотреть панель фильтров и карточки товаров
  expected-result: |
    Элементы каталога корректно отображаются на экране 768×1024, полностью видны и не перекрывают друг друга
  actual-result: |
    Элементы каталога отображаются некорректно: панель фильтров и карточки товаров сжаты, текст переносится, поля фильтра цены обрезаются
