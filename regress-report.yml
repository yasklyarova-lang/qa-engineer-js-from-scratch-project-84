bugreports:
- summary: |
    Фильтрация товаров некорректно работает при минимальной цене больше максимальной
environment: |
    Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
    macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app
    2. В поле минимальной цены ввести «7»
    3. В поле максимальной цены ввести «-4»
expected-result: |
    Товары не отображаются при некорректно заданном диапазоне цен
actual-result: |
    Товары продолжают отображаться, фильтрация по цене не применяется

- summary: |
      Блок фильтров смещён в нижнюю часть страницы
environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
steps-to-reproduce: |
      1. Открыть сайт https://products-store.hexlet.app
      2. Открыть каталог товаров
      3. Обратить внимание на расположение блока фильтров
      4. Прокрутить страницу вниз
expected-result: |
      Блок фильтров отображается рядом с товарами и доступен без прокрутки страницы до конца
actual-result: |
      Блок фильтров смещён в нижнюю часть страницы и доступен только после прокрутки страницы вниз
