bugreports:
  - summary: |
      Поиск товара зависит от фильтра «В наличии»
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
    steps-to-reproduce: |
      1. Открыть сайт https://products-store.hexlet.app
      2. Убедиться, что фильтр «В наличии» выключен
      3. Ввести в строку поиска «Essence Mascara Lash Princess»
      4. Нажать Enter
      5. Включить фильтр «В наличии»
    expected-result: |
      Товар «Essence Mascara Lash Princess» находится независимо от состояния фильтра «В наличии»
    actual-result: |
      При выключенном фильтре «В наличии» товар не находится
      После включения фильтра «В наличии» товар отображается
      Ошибка изображена на скриншотах "поиск товара по ключевому слову.png" и "поиск товара по ключевому слову с фильтром в наличии.png" в папке Screenshots

  - summary: |
      Фильтрация товаров по категории зависит от фильтра «В наличии»
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
    steps-to-reproduce: |
      1. Открыть сайт https://products-store-v2.hexlet.app
      2. Выбрать категорию furniture
      3. Убедиться, что фильтр «В наличии» выключен
      4. Включить фильтр «В наличии»
    expected-result: |
      Товары категории furniture отображаются независимо от состояния фильтра «В наличии»
    actual-result: |
      При выключенном фильтре «В наличии» отображаются товары, не относящиеся к категории furniture
      После включения фильтра «В наличии» отображаются товары категории furniture
      Ошибка изображена на скриншотах "категория регр.png" и "категория регр 1.png" в папке Screenshots

  - summary: |
      Фильтрация товаров по производителю зависит от фильтра «В наличии»
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
    steps-to-reproduce: |
      1. Открыть сайт https://products-store-v2.hexlet.app
      2. Выбрать производителя Gucci
      3. Убедиться, что фильтр «В наличии» выключен
      4. Включить фильтр «В наличии»
    expected-result: |
      В каталоге отображаются только товары производителя Gucci независимо от состояния фильтра «В наличии»
    actual-result: |
      При выключенном фильтре «В наличии» отображаются товары других производителей
      После включения фильтра «В наличии» отображается только товар производителя Gucci
      Ошибка изображена на скриншотах "регр производитель.png" и "регр производитель 1.png" в папке Screenshots

  - summary: |
      Фильтрация товаров по диапазону цены зависит от фильтра «В наличии»
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
    steps-to-reproduce: |
      1. Открыть сайт https://products-store-v2.hexlet.app
      2. Ввести «8» в поле минимальной цены
      3. Ввести «10» в поле максимальной цены
      4. Убедиться, что фильтр «В наличии» выключен
      5. Включить фильтр «В наличии»
    expected-result: |
      В каталоге отображаются товары с ценой от 8 до 10 включительно независимо от состояния фильтра «В наличии»
    actual-result: |
      При выключенном фильтре «В наличии» отображаются товары, цена которых не входит в диапазон от 8 до 10
      После включения фильтра «В наличии» отображаются товары с ценой от 8 до 10
      Ошибка изображена на скриншотах "регр цена.png" и "регр цена 1.png" в папке Screenshots

  - summary: |
      Отображаются товары при минимальной цене больше максимальной
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
    steps-to-reproduce: |
      1. Открыть сайт https://products-store-v2.hexlet.app
      2. Ввести «10» в поле минимальной цены
      3. Ввести «8» в поле максимальной цены
    expected-result: |
      Сайт не отображает товары, соответствующие некорректному диапазону, и не выдаёт ошибок
    actual-result: |
      В каталоге отображаются товары несмотря на то, что минимальная цена больше максимальной
      Ошибка изображена на скриншоте "регр некорр цена.png" в папке Screenshots

  - summary: |
      Время загрузки страницы при медленном соединении превышает 3 секунды
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
      Chrome DevTools, Network, 3G
    steps-to-reproduce: |
      1. Открыть сайт https://products-store-v2.hexlet.app
      2. Открыть Chrome DevTools → Network
      3. Установить ограничение скорости соединения 3G
      4. Очистить кэш браузера
      5. Перезагрузить страницу
      6. Проверить время загрузки страницы
    expected-result: |
      Основной контент страницы отображается и доступен пользователю не более чем за 3 секунды
    actual-result: |
      DOMContentLoaded составляет 4.10 секунды
      Load составляет 4.10 секунды
      Время загрузки превышает допустимые 3 секунды
      Ошибка изображена на скриншоте "медленная загрузка регр.png" в папке Screenshots

  - summary: |
      В мобильной версии блок фильтров смещён в нижнюю часть страницы
    environment: |
      Google Chrome 152.0.7977.76 (официальная сборка) (arm64)
      macOS 26.5.2 (25F84) MacBook Air, 2560 × 1664
    steps-to-reproduce: |
      1. Открыть сайт https://products-store.hexlet.app
      2. Открыть каталог товаров
      3. Обратить внимание на расположение блока фильтров
      4. Прокрутить страницу вниз
    expected-result: |
      Блок фильтров отображается рядом с товарами и доступен без прокрутки страницы до конца
    actual-result: |
      Блок фильтров смещён в нижнюю часть страницы и доступен только после прокрутки страницы вниз
      Ошибка изображена на скриншоте "в мобильном блоке фильтр смещен вниз.png" в папке Screenshots

  - summary: |
      При нагрузке 100 виртуальных пользователей часть запросов завершается ошибкой request timeout
    environment: |
      https://products-store-v2.hexlet.app/
      macOS 26.5.2 (25F84)
      k6 v2.3.0
    steps-to-reproduce: |
      1. Запустить нагрузочный тест сайта https://products-store-v2.hexlet.app/ с помощью k6
      2. Установить количество виртуальных пользователей 100
      3. Установить продолжительность теста 1 минута
      4. Дождаться завершения нагрузочного теста
      5. Проверить результаты выполнения запросов
    expected-result: |
      Сайт остается доступным при одновременной работе 100 виртуальных пользователей
      Все запросы выполняются без ошибок
    actual-result: |
      26 из 2731 запросов завершились ошибкой request timeout
      Доля неуспешных запросов составила 0.95%
      Ошибка изображена на скриншотах "Нагрузочное 1.png" и "Нагрузочное 2.png" в папке Screenshots
